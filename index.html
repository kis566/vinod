<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>Vinod Medical Store</title>
<style>
:root{--g:#0f5c4d;--g2:#0a4439;--mint:#e3f0ea;--bg:#f2f5f3;--card:#fff;--t:#14211c;--m:#5d6f67;--l:#d9e3dd;--am:#b7791f;--r:#c62d2d;--ok:#1d7a4a;--acc:#0f5c4d;--sh:0 1px 2px rgba(20,33,28,.08),0 4px 14px rgba(20,33,28,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1512;--card:#16211c;--t:#e6efe9;--m:#93a79c;--l:#28382f;--mint:#1b2b24;--acc:#4cc29b;--sh:0 1px 2px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 "Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit}
input,select{width:100%;min-height:46px;padding:10px 13px;border:1.5px solid var(--l);border-radius:12px;background:var(--card);color:var(--t);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(15,92,77,.18)}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
::placeholder{color:var(--m);opacity:.8}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
@media(min-width:600px){#app{border-inline:1px solid var(--l)}}
#hd{display:none;align-items:center;gap:8px;padding:12px 14px;background:var(--g);color:#fff;font-weight:700;font-size:17px}
#hd button{background:rgba(255,255,255,.14);border:0;color:#fff;min-width:40px;height:40px;border-radius:10px;font-size:19px;cursor:pointer}
#hd #langBtn{font-size:12px;font-weight:700;padding:0 10px}
#hd small{font-size:11px;font-weight:500;opacity:.85}
#m{flex:1;overflow:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
#nv{display:none;background:var(--card);border-top:1px solid var(--l);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
#nv button{flex:1;border:0;background:none;padding:7px 2px;color:var(--m);font-size:11.5px;font-weight:600;cursor:pointer;border-radius:12px}
#nv button.on{color:var(--acc);background:var(--mint)}
#nv b{display:block;font-size:20px;font-weight:400}
.card{background:var(--card);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 5px;font-weight:600}
.btn{display:block;width:100%;min-height:48px;margin-top:10px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.o{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.g{background:var(--ok)}
.btn.d{background:transparent;color:var(--r);border:1.5px solid var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:var(--g);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero small{opacity:.8}
.hero .n{font-size:38px;font-weight:800;line-height:1.1;margin:2px 0 10px}
.hero .row{display:flex;gap:18px;font-size:13px}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;font-weight:600;box-shadow:var(--sh)}
.act i{font-style:normal;font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--mint);display:grid;place-items:center}
.act.pri{background:var(--g);color:#fff;border:0;font-size:17px}
.act.pri i{background:rgba(255,255,255,.18)}
.act span{flex:1}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--l);cursor:pointer}
.li:last-child{border:0}
.li small,.muted{color:var(--m);font-size:12.5px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;background:#fde4e4;color:var(--r);margin-left:4px}
.chip.a{background:#fdf0d5;color:var(--am)}.chip.k{background:#dff3e7;color:var(--ok)}
.tabs{display:flex;gap:8px;margin-bottom:10px;overflow:auto}
.tabs button{border:1.5px solid var(--l);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.alert{display:flex;justify-content:space-between;background:#fdf0d5;color:#7a4b0b;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600;cursor:pointer}
.sp{position:absolute;inset:0;background:var(--g);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.sp .lg{font-size:56px;background:#fff;width:104px;height:104px;border-radius:26px;display:grid;place-items:center;margin-bottom:18px;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:25;background:var(--card);border:1px solid var(--l);border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.2);max-height:250px;overflow:auto;display:none}
.sugg .item{padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--l)}
.sugg .item:last-child{border:0}
#vo{display:none;position:absolute;inset:0;z-index:20;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#vo .mic{font-size:52px;border:4px solid var(--g);border-radius:50%;width:120px;height:120px;display:grid;place-items:center;margin-bottom:16px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#tst{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#14211c;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:30;font-size:13px;text-align:center;max-width:88%}
.bill{background:#fffdf8;color:#111;padding:16px;border:1.5px dashed #9bb0a5;border-radius:6px;font-size:13px}
.bill table{width:100%;border-collapse:collapse;margin:10px 0}
.bill th,.bill td{padding:6px 3px;border-bottom:1px solid #e4e0d4;text-align:left;vertical-align:top}
.bill .r{text-align:right}
.bill .rx{font-size:26px;color:var(--g);font-weight:800;float:right;line-height:1}
.bill .sp2{display:flex;justify-content:space-between}
#pb{display:none}
@page{margin:6mm}
@media print{body{background:#fff}#app{display:none}#pb{display:block!important}#pb .bill{border:0;font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hd"></div>
  <div id="m"></div>
  <div id="nv"></div>
  <div id="vo"><div class="mic">🎤</div><h3>सुन रहा हूँ…</h3>
    <div class="card" id="vt" style="min-width:80%;min-height:60px"></div>
    <button class="btn" onclick="VR&&VR.stop()">⏹ रोकें</button></div>
  <div id="tst" role="status" aria-live="polite"></div>
</div>
<div id="pb"></div>

all:'All',low:'Low stock',expg:'Expiry',remain:'Left',delMed:'Delete medicine',
setTitle:'Settings',sheetConn:'☁️ Google Sheet connection',urlLbl:'Apps Script Web App URL',keyLbl:'Secret key',saveConn:'Save + connect',syncNow:'🔄 Sync from Sheet now',sendAll:'⬆️ Send all data to Sheet',notConn:'Not connected',left:'Pending',lastErr:'Last error',
storeInfo:'Store info',storeName:'Store name',addr:'Address',gst:'GSTIN',dl:'Drug licence',logout:'↪ Log out',hideSheet:'Hide Google Sheet section',lang:'Language / भाषा',
wifiUrl:'WiFi printer URL (e.g. http://192.168.1.5:9100/print)',wifiHelp:'Enter bridge server or ESC/POS WiFi printer URL',printWifi:'🖨 Print via WiFi',printing:'Sending…',printed:'Sent to printer ✓',printFail:'Print failed',
settingsSaved:'Saved',fillFields:'Fill the required fields',langChanged:'Language changed',outOfStock:'Medicine not in stock',stockShort:'Not enough stock',onlyInStock:'Only in-stock medicines appear',noItem:'No medicine added',billBlocked:'Out of stock — bill not created',welcome:'Your health, always cared for',printSystem:'🖨 System / Bluetooth printer',stockBack:'Bill deleted, stock restored'}};
const T=k=>(I18N[S.lang||'hi']||I18N.hi)[k]||k;

let S=null;
try{S=JSON.parse(localStorage.getItem('vm'))}catch(e){}
S=S||{in:0,n:123,sales:[],
 st:{name:'Vinod Medical Store',addr:'Raniganj Bazar, Ballia (U.P.)',gst:'',dl:''},
 stock:[
  {n:'Paracetamol 500mg',q:50,e:'2027-01-01',r:25,t:10,b:'B12345'},
  {n:'Amoxicillin 500mg',q:30,e:'2026-12-05',r:85,t:10,b:'A2231'},
  {n:'ORS Powder',q:20,e:'2026-12-12',r:45,t:1,b:'O778'},
  {n:'Cetirizine 10mg',q:40,e:'2027-08-12',r:30,t:10,b:'C990'},
  {n:'Pantoprazole 40mg',q:25,e:'2027-09-26',r:110,t:10,b:'P451'}]};
S.url=S.url||'';S.key=S.key||'';S.q=S.q||[];S.lang=S.lang||'hi';S.hideSheet=!!S.hideSheet;S.wifiUrl=S.wifiUrl||'';S.pin=S.pin||'';
const save=()=>{try{localStorage.setItem('vm',JSON.stringify(S))}catch(e){}};
let D={doc:{},pat:{},items:[]},VR=null,CUR='',SY='',FL=0,SF='all',SG=[];

function toast(t){const e=$('#tst');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2400)}
function render(t,b,o={}){
  const h=$('#hd');h.style.display=t?'flex':'none';
  h.innerHTML=(o.back?`<button aria-label="back" onclick="go('${o.back}')">←</button>`:'')+`<span style="flex:1">${x(t)}</span><small id="sy">${x(SY)}</small><button id="langBtn" onclick="toggleLang()">${S.lang==='hi'?'EN':'हिं'}</button>`;
  $('#m').innerHTML=b;$('#nv').style.display=o.nav?'flex':'none';if(o.nav)renderNav();
}
function renderNav(){
  const it=[['home','🏠','home'],['hist','🧾','hist'],['stock','📦','stock'],['set','⚙️','settings']];
  $('#nv').innerHTML=it.map(([k,i,l])=>`<button class="${CUR==k?'on':''}" onclick="go('${k}')"><b>${i}</b>${T(l)}</button>`).join('');
}
function go(n,a){CUR=n;V[n](a);$('#m').scrollTop=0}
const val=id=>($('#'+id)||{}).value||'';
const upd=()=>{const e=$('#sy');if(e)e.textContent=SY};
const stHead=()=>`<b style="font-size:16px">${x(S.st.name)}</b><br>${x(S.st.addr)}${S.st.gst?`<br>GSTIN: ${x(S.st.gst)}`:''}${S.st.dl?`<br>Drug Licence No.: ${x(S.st.dl)}`:''}`;
const alerts=()=>S.stock.filter(s=>s.q<=20||dleft(s.e)<90);
function toggleLang(){S.lang=S.lang==='hi'?'en':'hi';save();V[CUR]?V[CUR]():go('home');toast(T('langChanged'))}

/* suggestions (in-stock only) */
function showSuggest(inp,box,q){
  const b=$('#'+box);if(!b)return;
  q=(q||'').toLowerCase().trim();
  SG=q?S.stock.filter(s=>s.n.toLowerCase().includes(q)&&s.q>0).slice(0,8):[];
  if(!SG.length){b.style.display='none';return}
  b.innerHTML=SG.map((s,i)=>{const dd=dleft(s.e);
    return `<div class="item" onclick="pick('${inp}','${box}',${i})"><b>${x(s.n)}</b> <span class="chip k">${s.q}</span>${s.q<=20?`<span class="chip a">${T('lowStock')}</span>`:''}${dd<90?`<span class="chip">${dd<0?T('expired'):T('expSoon')}</span>`:''}<br><small class="muted">₹${s.r} · Exp ${dmy(s.e)||'—'}${s.b?' · B:'+x(s.b):''}</small></div>`}).join('');
  b.style.display='block';
}
function pick(inp,box,i){$('#'+inp).value=SG[i].n;$('#'+box).style.display='none';if(inp==='in')fill()}

/* Google Sheet sync */
async function api(b){
  const r=await fetch(S.url,{method:'POST',body:JSON.stringify({...b,key:S.key})});
  const j=await r.json();if(!j.ok)throw new Error(j.err);return j;
}
function push(op){
  if(!S.url)return;
  if(op.action=='stock')S.q=S.q.filter(o=>o.action!='stock');
  S.q.push(op);save();flush();
}
async function flush(){
  if(!S.url||FL)return;FL=1;SY='⏳';upd();
  try{while(S.q.length){await api(S.q[0]);S.q.shift();save()}SY='☁️ ✓'}
  catch(e){S.err=String(e.message||e);save();SY='⚠️ '+S.q.length}
  FL=0;upd();
}
function syncAll(){
  if(!S.url)return toast(T('fillFields'));
  S.sales.forEach(s=>S.q.push({action:'sale',sale:s}));
  S.q=S.q.filter(o=>o.action!='stock');S.q.push({action:'stock',stock:S.stock});save();flush();toast('…');
}
async function load(manual){
  if(!S.url){if(manual)toast(T('fillFields'));return}
  await flush();
  if(S.q.length){if(manual)toast(T('left')+': '+S.q.length);return}
  try{
    SY='⏳';upd();
    const r=await fetch(S.url+'?key='+encodeURIComponent(S.key));
    const j=await r.json();if(!j.ok)throw new Error(j.err);
    const have=new Set(j.sales.map(s=>s.no));
    const loc=S.sales.filter(s=>!have.has(s.no));
    S.sales=[...loc,...j.sales];
    loc.forEach(s=>S.q.push({action:'sale',sale:s}));
    if(j.stock.length)S.stock=j.stock;else S.q.push({action:'stock',stock:S.stock});
    S.n=Math.max(123,...S.sales.map(s=>parseInt(String(s.no).split('/').pop())||0));
    save();if(S.q.length)await flush();else SY='☁️ ✓';
    const ae=document.activeElement,typing=ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName);
    if(['home','hist','stock'].includes(CUR)&&(manual||!typing))go(CUR);
    if(manual)toast('✓');
  }catch(e){SY='⚠️';upd();if(manual)toast(e.message||'offline')}
}

/* actions */
function setLang(l){S.lang=l;save();V.set();toast(T('langChanged'))}
function toggleHideSheet(v){S.hideSheet=v;save();V.set()}
function saveWifiUrl(id){S.wifiUrl=val(id||'wifiUrlIn').trim();save();toast(T('settingsSaved'))}
function login(){
  const v=val('pw').trim();
  if(!/^\d{4}$/.test(v))return toast(T('newPin'));
  if(!S.pin){S.pin=v;save()}else if(v!==S.pin)return toast(T('wrongPin'));
  S.in=1;save();go('home');load();
}
function logout(){S.in=0;save();go('login')}
function newSale(){D={doc:{},pat:{},items:[]};go('doc')}
function docNext(){
  const n=val('dn').trim(),r=val('dr').trim();
  if(!n||!r)return toast(T('fillFields'));
  D.doc={n,r,s:val('ds')};go('pat');
}
function patNext(){D.pat={n:val('pn'),m:val('pm'),d:val('pd')};go('add')}

function fill(){
  const k=find(val('in')),h=$('#hint');
  if(!k){if(h)h.textContent=T('onlyInStock');return}
  if(k.q<=0){toast('⚠️ '+T('outOfStock'));return}
  $('#ir').value=k.r;$('#it').value=k.t;$('#ib').value=k.b||'';$('#ie').value=k.e||'';
  if(h)h.textContent=`${T('remain')}: ${k.q} ${T('strip')}`;
}
function addItem(){
  const n=val('in').trim(),r=+val('ir'),t=+val('it')||1,q=+val('iq'),u=val('iu');
  if(!n||!r||!q)return toast(T('fillFields'));
  const k=find(n);
  if(!k||k.q<=0)return toast('⚠️ '+T('outOfStock'));
  const already=D.items.filter(i=>i.n.toLowerCase()==n.toLowerCase()).reduce((a,i)=>a+need(i),0);
  if(k.q<R2(need({q,u,t})+already))return toast(`⚠️ ${T('stockShort')} — ${T('remain')}: ${k.q} ${T('strip')}`);
  D.items.push({n:k.n,r,t,q,u,b:val('ib'),m:val('im'),e:val('ie'),a:R2(u=='tab'?r/t*q:r*q)});
  D.disc=+val('dc')||D.disc;go('add');
}
function delItem(k){D.items.splice(k,1);go('add')}
function toPrev(){
  if(!D.items.length)return toast('⚠️ '+T('noItem'));
  for(const i of D.items){const k=find(i.n);if(!k||k.q<need(i))return toast(`⚠️ "${i.n}" — ${T('outOfStock')}`)}
  D.disc=Math.max(0,+val('dc')||0);D.pay=val('pay')||'Cash';go('prev');
}
function mkSale(no){
  const d=(D.pat.d||nowIso()).split('T'),sub=tot(D.items),disc=Math.min(D.disc||0,sub);
  return{no,iso:d[0],date:dmy(d[0]),time:d[1]||'',doc:D.doc,pat:D.pat,items:D.items,sub,disc,pay:D.pay||'Cash',total:R2(sub-disc)};
}
function billH(s){
  const d=s.doc||{},pt=s.pat||{};
  return `<div class="bill"><span class="rx">℞</span>${stHead()}<hr style="border:0;border-top:1px dashed #9bb0a5;margin:10px 0">
  <div class="sp2" style="flex-wrap:wrap;gap:8px"><span>Bill No: <b>${x(s.no)}</b><br>Doctor: ${x(d.n)}<br>Reg. No.: ${x(d.r)}</span><span style="text-align:right">Date: ${x(s.date)}<br>${x(s.time)}</span></div>
  <p style="margin:8px 0 0">Patient: <b>${x(pt.n||'—')}</b> ${x(pt.m)}</p>
  <table><tr><th>#</th><th>${T('medName')}</th><th>Qty</th><th class="r">Rate</th><th class="r">Amt</th></tr>
  ${s.items.map((i,k)=>`<tr><td>${k+1}</td><td>${x(i.n)}${i.b?`<br><small>B:${x(i.b)}${i.e?' Exp:'+dmy(i.e):''}</small>`:''}</td><td>${i.q} ${i.u=='tab'?'Tab':'Strip'}</td><td class="r">₹${i.r}</td><td class="r">₹${i.a}</td></tr>`).join('')}</table>
  ${s.disc>0?`<div class="sp2"><span>Subtotal</span><span>₹${(+s.sub).toFixed(2)}</span></div><div class="sp2"><span>Discount</span><span>- ₹${(+s.disc).toFixed(2)}</span></div>`:''}
  <div class="sp2" style="font-size:17px"><b>Grand Total</b><b>₹${(+s.total).toFixed(2)}</b></div>
  <p style="margin:6px 0 0">Payment: ${x(s.pay||'Cash')}</p><p style="text-align:center;margin:12px 0 0;font-weight:600">Thank you! Visit again</p></div>`;
}
function saveBill(){
  for(const i of D.items){const k=find(i.n);if(!k||k.q<need(i))return toast(`⚠️ "${i.n}" — ${T('billBlocked')}`)}
  const s=mkSale(`VM/${new Date().getFullYear()}/${String(++S.n).padStart(4,'0')}`);
  s.items.forEach(i=>{const k=find(i.n);if(k)k.q=Math.max(0,R2(k.q-need(i)))});
  S.sales.unshift(s);save();push({action:'sale',sale:s});push({action:'stock',stock:S.stock});go('done');
}
function delSale(i){
  const s=S.sales[i];
  if(!confirm(T('del')+' '+s.no+' ?'))return;
  s.items.forEach(it=>{const k=find(it.n);if(k)k.q=R2(k.q+need(it))});
  S.sales.splice(i,1);save();
  push({action:'delSale',no:s.no});push({action:'stock',stock:S.stock});
  go('hist');toast(T('stockBack'));
}
function hl(q){
  q=(q||'').toLowerCase();const dt=val('hdt');
  const l=S.sales.map((s,i)=>[s,i]).filter(([s])=>(s.no+(s.pat.n||'')+(s.doc.n||'')).toLowerCase().includes(q)&&(!dt||s.iso==dt));
  const sum=R2(l.reduce((a,[s])=>a+s.total,0));
  $('#hl').innerHTML=l.length?`<div class="li" style="cursor:default;background:var(--mint)"><b>${l.length} ${T('bills')}</b><b>₹${sum}</b></div>`+
  l.map(([s,i])=>`<div class="li" onclick="go('view',${i})"><div><b>${x(s.no)}</b><span class="chip k">${x(s.pay||'Cash')}</span><br><small>${x(s.date)} ${x(s.pat.n)}</small></div><b style="color:var(--acc)">₹${(+s.total).toFixed(2)} ›</b></div>`).join('')
  :`<p style="padding:18px;color:var(--m);text-align:center">${T('noBills')}</p>`;
}
function sl(q){
  q=(q||'').toLowerCase();
  const f=S.stock.map((s,i)=>[s,i]).filter(([s])=>s.n.toLowerCase().includes(q)&&(SF=='all'||(SF=='low'&&s.q<=20)||(SF=='exp'&&dleft(s.e)<90)))
   .sort((a,b)=>SF=='exp'?dleft(a[0].e)-dleft(b[0].e):0);
  $('#sl').innerHTML=f.length?f.map(([s,i])=>{const dd=dleft(s.e);
   return `<div class="li" onclick="editStock(${i})"><div style="flex:1"><b>${x(s.n)}</b>${s.q<=20?`<span class="chip a">${T('lowStock')}</span>`:''}${dd<90?`<span class="chip">${dd<0?T('expired'):T('expSoon')}</span>`:''}
   <div class="muted"><b style="color:${s.q<=20?'var(--r)':'var(--ok)'}">${s.q} ${T('strip')}</b> · ₹${s.r} · Exp ${dmy(s.e)||'—'}${s.b?' · B:'+x(s.b):''}</div></div><span style="color:var(--acc);font-size:18px">›</span></div>`}).join('')
  :`<p style="padding:18px;color:var(--m);text-align:center">${T('noBills')}</p>`;
}
let EI=-1;
function editStock(i){
  const s=S.stock[i];EI=i;
  $('#sn').value=s.n;$('#sr').value=s.r;$('#se').value=s.e||'';$('#sb').value=s.b||'';$('#sq').value='';
  $('#sdel').style.display='block';$('#sf').scrollIntoView({behavior:'smooth'});
}
function delStock(){
  if(EI<0||!confirm(S.stock[EI].n+' ?'))return;
  S.stock.splice(EI,1);EI=-1;save();push({action:'stock',stock:S.stock});go('stock');
}
function addStock(){
  const n=val('sn').trim();
  if(!n||!val('sq'))return toast(T('fillFields'));
  const k=find(n);
  if(k){k.q=R2(k.q+ +val('sq'));if(val('sr'))k.r=+val('sr');if(val('se'))k.e=val('se');if(val('sb'))k.b=val('sb')}
  else S.stock.push({n,q:+val('sq'),r:+val('sr')||0,e:val('se'),t:10,b:val('sb')});
  EI=-1;save();push({action:'stock',stock:S.stock});go('stock');toast(T('settingsSaved'));
}
function saveSt(){
  if($('#s1'))S.st={name:val('s1')||S.st.name,addr:val('s2'),gst:val('s3').trim(),dl:val('s4').trim()};
  if($('#s5')){S.url=val('s5').trim();S.key=val('s6').trim()}
  save();toast(T('settingsSaved'));
  if(S.url&&$('#s5')){push({action:'stock',stock:S.stock});load(1)}
}

/* print / share */
function printBill(i){$('#pb').innerHTML=billH(S.sales[i]);window.print()}
function testPrint(){$('#pb').innerHTML=`<h3>TEST PRINT</h3><p>${x(S.st.name)}</p>`;window.print()}
const txt=s=>`${S.st.name}\nBill ${s.no} | ${s.date}\n`+s.items.map(i=>`${i.n} x${i.q} = ₹${i.a}`).join('\n')+`\nTotal: ₹${(+s.total).toFixed(2)}\n`;
async function printWifi(i){
  const url=(val('wifiUrlIn')||S.wifiUrl||'').trim();
  if(!url)return toast(T('fillFields'));
  S.wifiUrl=url;save();
  const s=S.sales[i],text=txt(s);toast(T('printing'));
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({billNo:s.no,html:billH(s),text})});
    if(!r.ok)throw new Error('HTTP '+r.status);toast(T('printed'));
  }catch(e){
    try{const r2=await fetch(url+(url.includes('?')?'&':'?')+'text='+encodeURIComponent(text));if(!r2.ok)throw new Error('HTTP '+r2.status);toast(T('printed'))}
    catch(e2){toast(T('printFail')+': '+e2.message);printBill(i)}
  }
}
function share(i){
  const s=S.sales[i],t=txt(s);
  if(navigator.share)navigator.share({title:s.no,text:t}).catch(()=>{});
  else{try{navigator.clipboard.writeText(t);toast('✓')}catch(e){}}
}
function wa(i){
  const s=S.sales[i];let m=String(s.pat.m).replace(/\D/g,'');if(m.length==10)m='91'+m;
  window.open('https://wa.me/'+m+'?text='+encodeURIComponent(txt(s)),'_blank');
}

/* voice */
function voice(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return toast('Voice not supported');
  $('#vo').style.display='flex';$('#vt').textContent='';
  const r=new R();VR=r;r.lang=S.lang==='hi'?'hi-IN':'en-US';r.interimResults=true;
  r.onresult=e=>{$('#vt').textContent=[...e.results].map(z=>z[0].transcript).join(' ')};
  r.onend=()=>{const t=$('#vt').textContent;$('#vo').style.display='none';if(t)parseV(t)};
  r.onerror=()=>{$('#vo').style.display='none'};
  r.start();
}
function parseV(t){
  const g=re=>(t.match(re)||[])[1],set=(id,v)=>{if(v)$('#'+id).value=v};
  set('in',t.split(/[,،]/)[0].trim());
  set('ir',g(/(?:रेट|rate)\D{0,12}?(\d+)/i));
  set('it',g(/(\d+)\s*(?:गोली|टैबलेट|tablet)/i));
  set('ib',g(/(?:बैच|batch)\s*(?:नंबर|number)?\s*([A-Za-z]*\d+[A-Za-z0-9]*)/i));
  const e=t.match(/(?:एक्सपायरी|expiry)\s*(\d{1,2})[-\/ ](\d{1,2})[-\/ ](\d{4})/i);
  if(e)set('ie',`${e[3]}-${p(e[2])}-${p(e[1])}`);
  fill();
}

window.addEventListener('online',()=>{flush();load()});
/* auto-sync: har 30 sec, aur app wapas khulte hi */
setInterval(()=>{if(S.in&&S.url&&!document.hidden&&!FL&&!['add','doc','pat','prev'].includes(CUR))load()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.in&&S.url&&!['add','doc','pat','prev'].includes(CUR))load()});
go('splash');
